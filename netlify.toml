[build]
  command = "pnpm run build"
  publish = ".next"

# Enable Git LFS
[build.environment]
  GIT_LFS_ENABLED = "true"
  NODE_VERSION = "18"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  # Increase function size limit to 50MB
  node_bundler = "esbuild"


# Ignore large media files during build
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

