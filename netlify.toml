[build]
  command = "pnpm run build"
  publish = ".next"

# Enable Git LFS
[build.environment]
  GIT_LFS_ENABLED = "true"
  NODE_VERSION = "18"
  # Increase Node.js memory limit for build
  NODE_OPTIONS = "--max-old-space-size=4096"

[[plugins]]
  package = "@netlify/plugin-nextjs"


[functions]
  # Use esbuild for faster, smaller bundles
  node_bundler = "esbuild"
  # Explicitly set directory
  directory = ".netlify/functions/"


# Ignore large media files during build
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# Serve media files as static assets
[[redirects]]
  from = "/images/*"
  to = "/images/:splat"
  status = 200
  force = false
  conditions = {Role = ["public"]}

